[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keepsake-for-icloud"
version = "0.1.0"
description = "Keeps your folders safe in iCloud Drive"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
keepsake = "keepsake.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keepsake = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B904"]

[tool.ruff.lint.per-file-ignores]
# The house diagram kit is shared verbatim between repositories.
"tools/gen_diagram.py" = ["E701", "E702", "E741"]
